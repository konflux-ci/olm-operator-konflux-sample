[tox]
minversion = 4.0
envlist =
    yamllint
    hadolint
    shellcheck
skip_missing_interpreters = true

labels =
    static = yamllint,hadolint,shellcheck

[testenv]
skip_install = true

[testenv:yamllint]
description = Lint Tekton YAML with yamllint
deps =
    yamllint>=1.35
commands =
    yamllint .tekton

[testenv:hadolint]
description = Lint container build files with hadolint
deps =
    hadolint-py==2.15.1.2
commands =
    hadolint --failure-threshold error Containerfile.gatekeeper Containerfile.gatekeeper-operator Containerfile.gatekeeper-operator-bundle v4.13/Containerfile.catalog

[testenv:shellcheck]
description = Lint shell scripts with shellcheck
allowlist_externals =
    shellcheck
commands =
    shellcheck -s bash bundle-hack/update_bundle.sh
