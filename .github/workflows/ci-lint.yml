---
name: static-lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: static-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install tox
        run: pip install tox

      - name: Run static lint
        run: tox -m static
